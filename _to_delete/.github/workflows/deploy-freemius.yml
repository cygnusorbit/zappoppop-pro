name: Deploy Pro to Freemius

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: freemius-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Tags containing a hyphen (e.g. v1.0.0-test) deploy to Freemius sandbox.
          if [[ "$VERSION" == *-* ]]; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches plugin header version
        run: |
          HDR=$(grep -m1 -E '^[[:space:]]*\*?[[:space:]]*Version:' zappoppop-pro.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r' | xargs)
          echo "Header: '${HDR}'  Tag: '${{ steps.ver.outputs.version }}'"
          if [ "$HDR" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag version does not match zappoppop-pro.php header version."
            exit 1
          fi

      - name: Build plugin zip
        run: |
          rm -rf build zappoppop-pro.zip
          mkdir -p build/zappoppop-pro
          rsync -a \
            --exclude='/build' \
            --exclude='/zappoppop-pro.zip' \
            --exclude-from=.distignore \
            ./ build/zappoppop-pro/
          (cd build && zip -rq ../zappoppop-pro.zip zappoppop-pro)
          unzip -l zappoppop-pro.zip | tail -n 5

      - name: Fetch Freemius PHP SDK
        run: |
          php -v
          php -m | grep -qi '^curl$' || { echo "::error::PHP curl extension missing on runner"; exit 1; }
          git clone --depth 1 https://github.com/Freemius/freemius-php-sdk.git "$RUNNER_TEMP/freemius-php-sdk"
          test -f "$RUNNER_TEMP/freemius-php-sdk/freemius/Freemius.php"

      - name: Deploy to Freemius
        env:
          FS_DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          FS_PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          FS_SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          FS_PLUGIN_ID: ${{ secrets.FREEMIUS_PLUGIN_ID }}
          FS_ZIP: zappoppop-pro.zip
          FS_VERSION: ${{ steps.ver.outputs.version }}
          FS_SANDBOX: ${{ steps.ver.outputs.sandbox }}
          FS_RELEASE_MODE: pending
          FS_SDK_DIR: ${{ runner.temp }}/freemius-php-sdk
        run: php bin/freemius-deploy.php
